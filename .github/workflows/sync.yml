name: Pandora Sync Controller

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository that received the change"
        required: true
        type: string
      source_sha:
        description: "Commit to synchronize"
        required: true
        type: string

  repository_dispatch:
    types:
      - repository_changed

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Determine source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.source_repo }}
          INPUT_SHA: ${{ inputs.source_sha }}
          EVENT_REPO: ${{ github.event.client_payload.source_repo }}
          EVENT_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            SOURCE_REPO="$EVENT_REPO"
            SOURCE_SHA="$EVENT_SHA"
          else
            SOURCE_REPO="$INPUT_REPO"
            SOURCE_SHA="$INPUT_SHA"
          fi

          echo "Source repository: $SOURCE_REPO"
          echo "Source commit: $SOURCE_SHA"

          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify source commit
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_REPO: ${{ steps.source.outputs.SOURCE_REPO }}
          SOURCE_SHA: ${{ steps.source.outputs.SOURCE_SHA }}
        run: |
          set -e

          gh api "repos/$SOURCE_REPO/commits/$SOURCE_SHA" > /dev/null

          echo "Source commit verified."

      - name: Check repository states
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_REPO: ${{ steps.source.outputs.SOURCE_REPO }}
          SOURCE_SHA: ${{ steps.source.outputs.SOURCE_SHA }}
        run: |
          set -e

          REPOS=(
            "jasonntiri1-create/Pandora"
            "jasonntiri1-create/spark-your-sparkle"
            "jasonntiri1-create/link-happy-stuff"
            "jasonntiri1-create/my-private-space"
          )

          echo "Current repository states:"

          for REPO in "${REPOS[@]}"; do
            SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha')

            echo "$REPO -> $SHA"

            if [ "$REPO" = "$SOURCE_REPO" ] && [ "$SHA" != "$SOURCE_SHA" ]; then
              echo "ERROR: supplied source commit does not match source main."
              exit 1
            fi
          done
