name: Pandora File Sync

on:
  push:
    branches:
      - main

  repository_dispatch:
    types:
      - repository_changed

  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository that changed"
        required: true
        type: string
      source_sha:
        description: "Commit SHA from source repository"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pandora-file-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Determine source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_SHA: ${{ github.event.client_payload.source_sha }}
          INPUT_REPO: ${{ inputs.source_repo }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            SOURCE_REPO="$DISPATCH_REPO"
            SOURCE_SHA="$DISPATCH_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_REPO="$INPUT_REPO"
            SOURCE_SHA="$INPUT_SHA"
          else
            SOURCE_REPO="jasonntiri1-create/seamless-integration"
            SOURCE_SHA="$(git ls-remote "https://github.com/${SOURCE_REPO}.git" refs/heads/main | awk '{print $1}')"
          fi

          if [ -z "$SOURCE_REPO" ] || [ -z "$SOURCE_SHA" ]; then
            echo "ERROR: Source repository or SHA is missing."
            exit 1
          fi

          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source repository: $SOURCE_REPO"
          echo "Source commit: $SOURCE_SHA"

      - name: Clone source repository
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git" \
            source

          cd source
          git checkout "$SOURCE_SHA"

          echo "Source repository checked out successfully."
          git status

      - name: Force synchronize private space
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          REPO="jasonntiri1-create/my-private-space"

          rm -rf target
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            target

          cd target
          git checkout main
          git config user.name "pandora-sync"
          git config user.email "pandora-sync@users.noreply.github.com"

          echo "Replacing synchronized files with source files (preserving target workflows)..."
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/workflows/" \
            ../source/ ./

          git add -A

          if git diff --cached --quiet; then
            echo "$REPO already has identical synchronized files."
            exit 0
          fi

          git commit -m "Sync files from $SOURCE_REPO"
          git push --force origin main
          echo "$REPO force-synchronized."
