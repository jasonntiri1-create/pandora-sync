name: Pandora File Sync

on:
  repository_dispatch:
    types:
      - repository_changed

  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository that changed"
        required: true
        type: string
      source_sha:
        description: "Commit SHA from source repository"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pandora-file-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Determine source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_SHA: ${{ github.event.client_payload.source_sha }}
          INPUT_REPO: ${{ inputs.source_repo }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            SOURCE_REPO="$DISPATCH_REPO"
            SOURCE_SHA="$DISPATCH_SHA"
          else
            SOURCE_REPO="$INPUT_REPO"
            SOURCE_SHA="$INPUT_SHA"
          fi

          if [ -z "$SOURCE_REPO" ] || [ -z "$SOURCE_SHA" ]; then
            echo "ERROR: Source repository or SHA is missing."
            exit 1
          fi

          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source repository: $SOURCE_REPO"
          echo "Source commit: $SOURCE_SHA"

      - name: Clone source repository
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git" \
            source

          cd source
          git checkout "$SOURCE_SHA"

          echo "Source repository checked out successfully."
          git status

      - name: Synchronize files to all repositories
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          REPOS=(
            "jasonntiri1-create/Pandora"
            "jasonntiri1-create/spark-your-sparkle"
            "jasonntiri1-create/link-happy-stuff"
            "jasonntiri1-create/my-private-space"
          )

          for REPO in "${REPOS[@]}"; do
            if [ "$REPO" = "$SOURCE_REPO" ]; then
              echo "Skipping source repository: $REPO"
              continue
            fi

            echo ""
            echo "========================================"
            echo "Synchronizing: $REPO"
            echo "========================================"

            rm -rf target

            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
              target

            cd target

            git checkout main

            git config user.name "pandora-sync"
            git config user.email "pandora-sync@users.noreply.github.com"

            echo "Replacing repository files with source files..."

            rsync -a --delete \
              --exclude=".git/" \
              ../source/ ./

            git add -A

            if git diff --cached --quiet; then
              echo "$REPO already has identical files."
              cd ..
              continue
            fi

            git commit \
              -m "Sync files from $SOURCE_REPO"

            git push origin main

            echo "$REPO synchronized."

            cd ..
          done

      - name: Verify file synchronization
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          cd source

          find . \
            -type f \
            -not -path "./.git/*" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > ../source-files.sha256

          cd ..

          REPOS=(
            "jasonntiri1-create/Pandora"
            "jasonntiri1-create/spark-your-sparkle"
            "jasonntiri1-create/link-happy-stuff"
            "jasonntiri1-create/my-private-space"
          )

          for REPO in "${REPOS[@]}"; do
            if [ "$REPO" = "$SOURCE_REPO" ]; then
              continue
            fi

            rm -rf verify

            git clone --quiet \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
              verify

            cd verify

            find . \
              -type f \
              -not -path "./.git/*" \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > ../target-files.sha256

            cd ..

            if ! diff -u source-files.sha256 target-files.sha256; then
              echo "ERROR: File contents differ in $REPO"
              exit 1
            fi

            echo "$REPO: FILES IDENTICAL"
          done

          echo ""
          echo "========================================"
          echo "ALL REPOSITORIES HAVE IDENTICAL FILES"
          echo "========================================"
