name: Pandora Sync Controller

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository that received the change"
        required: true
        type: string
      source_sha:
        description: "Commit to synchronize"
        required: true
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - name: Show synchronization request
        run: |
          echo "Source repository: ${{ inputs.source_repo }}"
          echo "Source commit: ${{ inputs.source_sha }}"
          echo "Synchronization controller received the request."
