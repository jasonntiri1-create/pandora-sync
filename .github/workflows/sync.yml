name: Pandora File Sync

on:
  # Keep the original push-driven path available when the source notifier
  # can dispatch successfully.
  repository_dispatch:
    types:
      - repository_changed

  # Reliable fallback: the sync controller polls Pandora directly, so sync
  # does not depend on a second workflow in the source repository.
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository that changed"
        required: false
        default: "jasonntiri1-create/Pandora"
        type: string
      source_sha:
        description: "Commit SHA from source repository (leave empty to use main)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: pandora-file-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Determine source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_SHA: ${{ github.event.client_payload.source_sha }}
          INPUT_REPO: ${{ inputs.source_repo }}
          INPUT_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -n "$DISPATCH_REPO" ]; then
            SOURCE_REPO="$DISPATCH_REPO"
            SOURCE_SHA="$DISPATCH_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_REPO="${INPUT_REPO:-jasonntiri1-create/Pandora}"
            SOURCE_SHA="$INPUT_SHA"
          else
            SOURCE_REPO="jasonntiri1-create/Pandora"
            SOURCE_SHA=""
          fi

          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git" refs/heads/main | awk '{print $1}')"
          fi

          if [ -z "$SOURCE_REPO" ] || [ -z "$SOURCE_SHA" ]; then
            echo "ERROR: Source repository or SHA is missing."
            exit 1
          fi

          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source repository: $SOURCE_REPO"
          echo "Source commit: $SOURCE_SHA"

      - name: Clone source repository
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git" \
            source

          cd source
          git checkout "$SOURCE_SHA"

          echo "Source repository checked out successfully."
          git status

      - name: Synchronize files to all repositories
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          REPOS=(
            "jasonntiri1-create/Pandora"
            "jasonntiri1-create/spark-your-sparkle"
            "jasonntiri1-create/link-happy-stuff"
            "jasonntiri1-create/my-private-space"
            "jasonntiri1-create/seamless-integration"
          )

          for REPO in "${REPOS[@]}"; do
            if [ "$REPO" = "$SOURCE_REPO" ]; then
              echo "Skipping source repository: $REPO"
              continue
            fi

            echo ""
            echo "========================================"
            echo "Synchronizing: $REPO"
            echo "========================================"

            rm -rf target

            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
              target

            cd target
            git checkout main
            git config user.name "pandora-sync"
            git config user.email "pandora-sync@users.noreply.github.com"

            echo "Replacing repository files with source files (preserving target workflows)..."

            rsync -a --delete \
              --exclude=".git/" \
              --exclude=".github/workflows/" \
              ../source/ ./

            git add -A

            if git diff --cached --quiet; then
              echo "$REPO already has identical synchronized files."
              cd ..
              continue
            fi

            git commit -m "Sync files from $SOURCE_REPO"
            git push origin main

            echo "$REPO synchronized."
            cd ..
          done

      - name: Verify file synchronization
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          cd source
          find . \
            -type f \
            -not -path "./.git/*" \
            -not -path "./.github/workflows/*" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > ../source-files.sha256
          cd ..

          REPOS=(
            "jasonntiri1-create/Pandora"
            "jasonntiri1-create/spark-your-sparkle"
            "jasonntiri1-create/link-happy-stuff"
            "jasonntiri1-create/my-private-space"
            "jasonntiri1-create/seamless-integration"
          )

          for REPO in "${REPOS[@]}"; do
            if [ "$REPO" = "$SOURCE_REPO" ]; then
              continue
            fi

            rm -rf verify
            git clone --quiet \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
              verify

            cd verify
            find . \
              -type f \
              -not -path "./.git/*" \
              -not -path "./.github/workflows/*" \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > ../target-files.sha256
            cd ..

            if ! diff -u source-files.sha256 target-files.sha256; then
              echo "ERROR: Synchronized file contents differ in $REPO"
              exit 1
            fi

            echo "$REPO: SYNCHRONIZED FILES IDENTICAL (target workflows preserved)"
          done

          echo ""
          echo "========================================"
          echo "ALL REPOSITORIES SYNCHRONIZED"
          echo "TARGET GITHUB WORKFLOWS PRESERVED"
          echo "========================================"
