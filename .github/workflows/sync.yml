name: Pandora Sync Controller

on:
  repository_dispatch:
    types:
      - repository_changed

  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository that changed"
        required: true
        type: string
      source_sha:
        description: "Commit SHA"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pandora-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sync state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine source
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.source_repo }}
          INPUT_SHA: ${{ inputs.source_sha }}
          EVENT_REPO: ${{ github.event.client_payload.source_repo }}
          EVENT_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            SOURCE_REPO="$EVENT_REPO"
            SOURCE_SHA="$EVENT_SHA"
          else
            SOURCE_REPO="$INPUT_REPO"
            SOURCE_SHA="$INPUT_SHA"
          fi

          if [ -z "$SOURCE_REPO" ] || [ -z "$SOURCE_SHA" ]; then
            echo "ERROR: Source repository or SHA is missing."
            exit 1
          fi

          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          echo "Source repository: $SOURCE_REPO"
          echo "Source commit: $SOURCE_SHA"

      - name: Load synchronization state
        run: |
          set -e

          if [ ! -f sync-state.txt ]; then
            echo "ERROR: sync-state.txt does not exist."
            exit 1
          fi

          LAST_SYNC_SHA=$(tr -d '[:space:]' < sync-state.txt)

          if [ -z "$LAST_SYNC_SHA" ]; then
            echo "ERROR: sync-state.txt is empty."
            exit 1
          fi

          echo "LAST_SYNC_SHA=$LAST_SYNC_SHA" >> "$GITHUB_ENV"

          echo "Last synchronized commit: $LAST_SYNC_SHA"

      - name: Verify source commit
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          gh api \
            "repos/$SOURCE_REPO/commits/$SOURCE_SHA" \
            > /dev/null

          echo "Source commit exists."

      - name: Inspect repository versions
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          REPOS=(
            "jasonntiri1-create/Pandora"
            "jasonntiri1-create/spark-your-sparkle"
            "jasonntiri1-create/link-happy-stuff"
            "jasonntiri1-create/my-private-space"
          )

          echo "Repository state:"
          echo "----------------"

          SOURCE_PRESENT=false
          CONFLICT=false

          declare -A SHA_COUNTS

          for REPO in "${REPOS[@]}"; do
            SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha')

            echo "$REPO -> $SHA"

            SHA_COUNTS["$SHA"]=$(( ${SHA_COUNTS["$SHA"]:-0} + 1 ))

            if [ "$SHA" = "$SOURCE_SHA" ]; then
              SOURCE_PRESENT=true
            fi
          done

          echo ""
          echo "Last synchronized SHA: $LAST_SYNC_SHA"
          echo "Incoming source SHA:   $SOURCE_SHA"
          echo ""

          if [ "$SOURCE_PRESENT" != "true" ]; then
            echo "ERROR: The incoming source SHA is not currently the HEAD of any target repository."
            echo "The source may have moved or the notification may be stale."
            exit 1
          fi

          echo "Current SHA groups:"

          for SHA in "${!SHA_COUNTS[@]}"; do
            COUNT="${SHA_COUNTS[$SHA]}"
            echo "$SHA -> $COUNT repository/repositories"

            if [ "$SHA" != "$LAST_SYNC_SHA" ] && [ "$SHA" != "$SOURCE_SHA" ]; then
              echo ""
              echo "CONFLICT DETECTED."
              echo "A repository contains a different new version:"
              echo "$SHA"
              echo ""
              echo "Expected synchronized version:"
              echo "$SOURCE_SHA"
              CONFLICT=true
            fi
          done

          if [ "$CONFLICT" = "true" ]; then
            echo ""
            echo "No repository will be overwritten."
            exit 1
          fi

          echo ""
          echo "All repositories that moved beyond the previous baseline"
          echo "agree with the incoming source version."

      - name: Verify source has not moved
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          CURRENT_SOURCE_SHA=$(gh api \
            "repos/$SOURCE_REPO/commits/main" \
            --jq '.sha')

          if [ "$CURRENT_SOURCE_SHA" != "$SOURCE_SHA" ]; then
            echo "ERROR: Source repository changed during synchronization."
            echo "Expected: $SOURCE_SHA"
            echo "Actual:   $CURRENT_SOURCE_SHA"
            exit 1
          fi

          echo "Source is stable at $SOURCE_SHA."

      - name: Synchronize all repositories
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          REPOS=(
            "jasonntiri1-create/Pandora"
            "jasonntiri1-create/spark-your-sparkle"
            "jasonntiri1-create/link-happy-stuff"
            "jasonntiri1-create/my-private-space"
          )

          for REPO in "${REPOS[@]}"; do
            echo "Synchronizing $REPO..."

            gh api \
              --method PATCH \
              "repos/$REPO/git/refs/heads/main" \
              -f sha="$SOURCE_SHA" \
              -F force=true

            echo "$REPO -> $SOURCE_SHA"
          done

      - name: Verify synchronization
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          REPOS=(
            "jasonntiri1-create/Pandora"
            "jasonntiri1-create/spark-your-sparkle"
            "jasonntiri1-create/link-happy-stuff"
            "jasonntiri1-create/my-private-space"
          )

          FAILED=false

          for REPO in "${REPOS[@]}"; do
            SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha')

            if [ "$SHA" != "$SOURCE_SHA" ]; then
              echo "ERROR: $REPO failed synchronization."
              echo "Expected: $SOURCE_SHA"
              echo "Actual:   $SHA"
              FAILED=true
            else
              echo "$REPO synchronized successfully."
            fi
          done

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

      - name: Update synchronization state
        run: |
          set -e

          echo "$SOURCE_SHA" > sync-state.txt

          git config user.name "pandora-sync"
          git config user.email "pandora-sync@users.noreply.github.com"

          git add sync-state.txt

          if git diff --cached --quiet; then
            echo "Synchronization state already current."
            exit 0
          fi

          git commit -m "Update sync state to $SOURCE_SHA"
          git push origin HEAD:main
